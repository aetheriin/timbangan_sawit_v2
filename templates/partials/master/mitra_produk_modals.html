<!-- MODAL: Tambah / Ubah Mitra -->
<div id="modalMitra" class="modal-overlay">
    <form id="formMitra" class="modal-box" autocomplete="off">
        <div class="modal-header">
            <h3 id="judulModalMitra" class="font-bold">Tambah Mitra</h3>
            <button type="button" data-on-click="closeModal" data-arg="modalMitra" title="Tutup"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-6 space-y-3">
            <input type="hidden" name="id_supplier">
            <div>
                <label class="field-label" for="mitraKode">Kode</label>
                <input type="text" id="mitraKode" name="kode_supplier" required maxlength="20" class="input-field uppercase">
            </div>
            <div>
                <label class="field-label" for="mitraNama">Nama</label>
                <input type="text" id="mitraNama" name="nama_supplier" required maxlength="100" class="input-field">
            </div>
            <div>
                <span class="field-label">Peran (boleh keduanya)</span>
                <div class="flex gap-5 text-sm">
                    <label class="flex items-center gap-2"><input type="checkbox" name="is_customer" value="1"> Customer</label>
                    <label class="flex items-center gap-2"><input type="checkbox" name="is_angkutan" value="1"> Pengangkutan</label>
                </div>
            </div>
        </div>
        <div class="px-6 pb-6 flex justify-end gap-2">
            <button type="button" data-on-click="closeModal" data-arg="modalMitra" class="btn-secondary">Batal</button>
            <button type="submit" class="btn-primary">Simpan</button>
        </div>
    </form>
</div>

<!-- MODAL: Tambah / Ubah Produk -->
<div id="modalProduk" class="modal-overlay">
    <form id="formProduk" class="modal-box" autocomplete="off">
        <div class="modal-header">
            <h3 id="judulModalProduk" class="font-bold">Tambah Produk</h3>
            <button type="button" data-on-click="closeModal" data-arg="modalProduk" title="Tutup"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-6 space-y-3">
            <input type="hidden" name="id_produk">
            <div>
                <label class="field-label" for="prodNama">Nama Produk</label>
                <input type="text" id="prodNama" name="nama_produk" required maxlength="100" class="input-field">
            </div>
            <div>
                <label class="field-label" for="prodKategori">Kategori</label>
                <select id="prodKategori" name="kategori" required class="input-field">
                    {% for k in kategori_produk %}<option value="{{ k }}">{{ k.replace('_', ' ').title() }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label class="field-label" for="prodAlur">Alur Tahap</label>
                <select id="prodAlur" name="id_alur" required class="input-field">
                    {% for a in alur_list if a.kode != 'TIMBANG_SAJA' %}<option value="{{ a.id_alur }}">{{ a.nama }}</option>{% endfor %}
                </select>
            </div>
        </div>
        <div class="px-6 pb-6 flex justify-end gap-2">
            <button type="button" data-on-click="closeModal" data-arg="modalProduk" class="btn-secondary">Batal</button>
            <button type="submit" class="btn-primary">Simpan</button>
        </div>
    </form>
</div>
