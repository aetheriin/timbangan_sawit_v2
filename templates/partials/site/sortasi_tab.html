<div data-tab-content="sortasi" class="hidden">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="section-box p-5">
            <h3 class="text-sm font-semibold text-slate-700 mb-4 pb-2 border-b">Form Input Grading & Mutu Buah</h3>
            <div class="grid grid-cols-2 gap-4">
                <div><label class="field-label">Buah Mentah (%)</label><input type="number" id="srMentah" class="input-field" data-on-input="hitungPotongan"></div>
                <div><label class="field-label">Buah Busuk (%)</label><input type="number" id="srBusuk" class="input-field" data-on-input="hitungPotongan"></div>
                <div><label class="field-label">Tangkai Panjang (%)</label><input type="number" id="srTangkai" class="input-field" data-on-input="hitungPotongan"></div>
                <div><label class="field-label">Sampah/Kotoran (%)</label><input type="number" id="srSampah" class="input-field" data-on-input="hitungPotongan"></div>
                <div><label class="field-label">Buah Matang (%)</label><input type="number" id="srMatang" class="input-field"></div>
                <div><label class="field-label">Brondolan (%)</label><input type="number" id="srBrondolan" class="input-field"></div>
            </div>
            <div class="mt-4"><label class="field-label">Catatan</label><textarea id="srCatatan" class="input-field" rows="2"></textarea></div>
            <button data-on-click="submitSortasi" data-arg="$el" class="btn-primary mt-4 w-full">Submit</button>
        </div>

        <div class="section-box p-5">
            <h3 class="text-sm font-semibold text-slate-700 mb-4 pb-2 border-b">Ringkasan Kalkulasi & Potongan</h3>
            <table class="w-full text-sm">
                <tr class="border-b"><td class="py-2 text-slate-500">Status Mutu Buah</td><td class="py-2 text-right font-semibold" id="srStatusMutu">-</td></tr>
                <tr class="border-b"><td class="py-2 text-slate-500">Estimasi Potongan (%)</td><td class="py-2 text-right font-semibold" id="srEstimasiPersen">0%</td></tr>
                <tr class="border-b"><td class="py-2 text-slate-500">Netto Acuan (Kg)</td><td class="py-2 text-right font-semibold" id="srBeratAcuan">-</td></tr>
                <tr><td class="py-2 text-slate-700 font-medium">Total Potongan Berat</td><td class="py-2 text-right font-bold text-red-600" id="srTotalPotongan">0 Kg</td></tr>
            </table>
        </div>
    </div>

    <div class="section-box mt-5">
        <div class="section-header" data-on-click="toggleSection" data-arg="history-sortasi">
            <span class="section-header-text"><i id="chevron-history-sortasi" class="fa-solid fa-chevron-down section-chevron"></i> History Sortasi</span>
        </div>
        <div id="body-history-sortasi" class="section-body">
            <table class="w-full text-left text-sm">
                <thead class="table-header-row"><tr><th class="table-cell">No. Plat</th><th class="table-cell">Produk</th><th class="table-cell">Supplier</th><th class="table-cell">Status</th></tr></thead>
                <tbody id="tabelHistorySortasi" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>
</div>
