<div data-tab-content="lab" class="hidden">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="section-box p-5">
            <h3 class="text-sm font-semibold text-slate-700 mb-4 pb-2 border-b">Form Input Pengujian Sampel Laboratorium</h3>
            <div class="grid grid-cols-2 gap-4">
                <div><label class="field-label">FFA (%)</label><input type="number" id="labFfa" class="input-field" oninput="cekStandar()"></div>
                <div><label class="field-label">Air (%)</label><input type="number" id="labAir" class="input-field" oninput="cekStandar()"></div>
                <div><label class="field-label">Kotoran (%)</label><input type="number" id="labKotoran" class="input-field" oninput="cekStandar()"></div>
                <div><label class="field-label">Warna Locis</label><input type="text" id="labWarna" class="input-field"></div>
            </div>
            <div class="mt-4">
                <label class="field-label">Status Kelayakan Mutu</label>
                <div class="flex gap-3">
                    <button onclick="setKeputusan('APPROVE')" id="btnApprove" class="flex-1 border rounded-lg py-2 text-sm text-emerald-600 border-emerald-300"><i class="fa-solid fa-check mr-1"></i>Approve</button>
                    <button onclick="setKeputusan('REJECT')" id="btnReject" class="flex-1 border rounded-lg py-2 text-sm text-red-600 border-red-300"><i class="fa-solid fa-xmark mr-1"></i>Reject</button>
                </div>
            </div>
            <button onclick="submitLab()" class="btn-primary mt-4 w-full">Submit</button>
        </div>

        <div class="section-box p-5">
            <h3 class="text-sm font-semibold text-slate-700 mb-4 pb-2 border-b">Standar Mutu & Dokumen COA</h3>
            <table class="w-full text-sm mb-4">
                <tr class="border-b"><td class="py-2 text-slate-500">Maksimal Kadar FFA</td><td class="py-2 text-right font-semibold" id="stdFfa">-</td></tr>
                <tr class="border-b"><td class="py-2 text-slate-500">Maksimal Kadar Air</td><td class="py-2 text-right font-semibold" id="stdAir">-</td></tr>
                <tr class="border-b"><td class="py-2 text-slate-500">Maksimal Kadar Kotoran</td><td class="py-2 text-right font-semibold" id="stdKotoran">-</td></tr>
                <tr><td class="py-2 text-slate-700 font-medium">Status Pengujian</td><td class="py-2 text-right font-bold" id="labStatusLive">-</td></tr>
            </table>
            <div class="flex gap-3">
                <button onclick="openModal('modalStandarMutu')" class="btn-secondary flex-1 text-xs">Update Standar</button>
                <button onclick="cetakCOA()" class="btn-success flex-1 text-xs"><i class="fa-solid fa-print mr-1"></i>Cetak COA</button>
            </div>
        </div>
    </div>

    <div class="section-box mt-5">
        <div class="section-header" onclick="toggleSection('history-lab')">
            <span class="section-header-text"><i id="chevron-history-lab" class="fa-solid fa-chevron-down section-chevron"></i> History Laboratorium</span>
        </div>
        <div id="body-history-lab" class="section-body">
            <table class="w-full text-left text-sm">
                <thead class="table-header-row"><tr><th class="table-cell">No. Plat</th><th class="table-cell">Produk</th><th class="table-cell">Supplier</th><th class="table-cell">Status</th></tr></thead>
                <tbody id="tabelHistoryLab" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="printAreaCOA" class="hidden"></div>
