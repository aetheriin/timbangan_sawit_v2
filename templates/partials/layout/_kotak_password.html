{# Kotak password dengan ikon gembok dan tombol mata (static/js/lihat_password.js) #}
{% macro kotak_password(nama, label, autocomplete='current-password', minlength=None, autofocus=false) %}
<div>
    <label class="field-label" for="{{ nama }}">{{ label }}</label>
    <div class="relative">
        <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="password" id="{{ nama }}" name="{{ nama }}" required autocomplete="{{ autocomplete }}"
               {% if minlength %}minlength="{{ minlength }}"{% endif %} {% if autofocus %}autofocus{% endif %}
               class="input-field py-2.5 pl-9 pr-11">
        <button type="button" data-lihat-password class="absolute right-1.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-md text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition"
                title="Tampilkan password" aria-label="Tampilkan password"><i class="fa-regular fa-eye"></i></button>
    </div>
</div>
{% endmacro %}
