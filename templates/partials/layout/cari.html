{# Pencarian global (Ctrl+K). Logika di static/js/cari.js #}
<div id="cariOverlay" class="cari-overlay hidden" data-on-click="tutupCariLuar" data-arg="$event">
    <div class="cari-box" role="dialog" aria-label="Pencarian">
        <div class="flex items-center gap-3 px-4 py-3 border-b border-slate-100">
            <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
            <input type="text" id="cariInput" autocomplete="off" class="flex-1 text-base bg-transparent border-0 outline-none placeholder:text-slate-400 text-slate-900"
                   placeholder="{{ 'Cari pengguna atau menu admin...' if current_user.is_admin else 'Cari plat, tiket, DO, supir, customer, atau menu...' }}">
            <button type="button" data-on-click="tutupCari" class="sidebar-ikon-btn" title="Tutup (Esc)" aria-label="Tutup pencarian">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="cariHasil" class="overflow-y-auto p-3 space-y-4"></div>
        <div class="flex items-center gap-4 px-4 py-2 border-t border-slate-100 bg-slate-50 text-xs text-slate-500">
            <span><kbd class="topbar-kbd">↑</kbd> <kbd class="topbar-kbd">↓</kbd> pilih</span>
            <span><kbd class="topbar-kbd">Enter</kbd> buka</span>
            <span><kbd class="topbar-kbd">Esc</kbd> tutup</span>
            <span class="ml-auto"><kbd class="topbar-kbd">?</kbd> pintasan keyboard lainnya</span>
        </div>
    </div>
</div>
