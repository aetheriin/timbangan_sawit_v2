<!-- MODAL: Company -->
<div id="modalOrg-company" class="modal-overlay">
    <form id="formOrg-company" class="modal-box" autocomplete="off" data-url="/api/admin/organisasi/company/simpan">
        <div class="modal-header">
            <h3 class="font-bold" data-judul>Company</h3>
            <button type="button" data-on-click="closeModal" data-arg="modalOrg-company" title="Tutup"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-6 grid grid-cols-3 gap-3">
            <input type="hidden" name="id_company">
            <div><label class="field-label" for="orgCompKode">Kode</label>
                <input type="text" id="orgCompKode" name="kode" required maxlength="10" class="input-field uppercase"></div>
            <div class="col-span-2"><label class="field-label" for="orgCompNama">Nama</label>
                <input type="text" id="orgCompNama" name="nama" required maxlength="100" class="input-field"></div>
        </div>
        <div class="px-6 pb-6 flex justify-end gap-2">
            <button type="button" data-on-click="closeModal" data-arg="modalOrg-company" class="btn-secondary">Batal</button>
            <button type="submit" class="btn-primary">Simpan</button>
        </div>
    </form>
</div>

<!-- MODAL: Area -->
<div id="modalOrg-area" class="modal-overlay">
    <form id="formOrg-area" class="modal-box" autocomplete="off" data-url="/api/admin/organisasi/area/simpan">
        <div class="modal-header">
            <h3 class="font-bold" data-judul>Area</h3>
            <button type="button" data-on-click="closeModal" data-arg="modalOrg-area" title="Tutup"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-6 grid grid-cols-3 gap-3">
            <input type="hidden" name="id_comp_area">
            <div class="col-span-3"><label class="field-label" for="orgAreaCompany">Company</label>
                <select id="orgAreaCompany" name="id_company" required class="input-field">
                    {% for c in company_list %}<option value="{{ c.id_company }}">{{ c.nama }}</option>{% endfor %}
                </select></div>
            <div><label class="field-label" for="orgAreaKode">Kode</label>
                <input type="text" id="orgAreaKode" name="kode" required maxlength="10" class="input-field uppercase"></div>
            <div class="col-span-2"><label class="field-label" for="orgAreaNama">Nama</label>
                <input type="text" id="orgAreaNama" name="nama" required maxlength="100" class="input-field"></div>
            <div class="col-span-3"><label class="field-label" for="orgAreaAlamat">Alamat</label>
                <input type="text" id="orgAreaAlamat" name="alamat" maxlength="255" class="input-field"></div>
        </div>
        <div class="px-6 pb-6 flex justify-end gap-2">
            <button type="button" data-on-click="closeModal" data-arg="modalOrg-area" class="btn-secondary">Batal</button>
            <button type="submit" class="btn-primary">Simpan</button>
        </div>
    </form>
</div>

<!-- MODAL: Mill -->
<div id="modalOrg-mill" class="modal-overlay">
    <form id="formOrg-mill" class="modal-box" autocomplete="off" data-url="/api/admin/organisasi/mill/simpan">
        <div class="modal-header">
            <h3 class="font-bold" data-judul>Mill</h3>
            <button type="button" data-on-click="closeModal" data-arg="modalOrg-mill" title="Tutup"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-6 grid grid-cols-3 gap-3">
            <input type="hidden" name="id_mill">
            <div class="col-span-3"><label class="field-label" for="orgMillArea">Area</label>
                <select id="orgMillArea" name="id_comp_area" required class="input-field">
                    {% for a in area_list %}<option value="{{ a.id_comp_area }}">{{ a.nama }}</option>{% endfor %}
                </select></div>
            <div><label class="field-label" for="orgMillKode">Kode</label>
                <input type="text" id="orgMillKode" name="kode" required maxlength="10" class="input-field uppercase"></div>
            <div class="col-span-2"><label class="field-label" for="orgMillNama">Nama</label>
                <input type="text" id="orgMillNama" name="nama" required maxlength="100" class="input-field"></div>
            <div class="col-span-3"><label class="field-label" for="orgMillAlur">Alur Tahap</label>
                <select id="orgMillAlur" name="id_alur" required class="input-field">
                    {% for a in alur_list %}<option value="{{ a.id_alur }}">{{ a.nama }}</option>{% endfor %}
                </select></div>
        </div>
        <div class="px-6 pb-6 flex justify-end gap-2">
            <button type="button" data-on-click="closeModal" data-arg="modalOrg-mill" class="btn-secondary">Batal</button>
            <button type="submit" class="btn-primary">Simpan</button>
        </div>
    </form>
</div>

<!-- MODAL: Kategori Personel (kode personel per kategori, mis. DRV-001) -->
<div id="modalOrg-kategori" class="modal-overlay">
    <form id="formOrg-kategori" class="modal-box" autocomplete="off" data-url="/api/admin/organisasi/kategori/simpan">
        <div class="modal-header">
            <h3 class="font-bold" data-judul>Kategori Personel</h3>
            <button type="button" data-on-click="closeModal" data-arg="modalOrg-kategori" title="Tutup"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-6 space-y-3">
            <input type="hidden" name="kode_lama">
            <div class="grid grid-cols-2 gap-3">
                <div><label class="field-label" for="orgKatKode">Kode</label>
                    <input type="text" id="orgKatKode" name="kode" required maxlength="20" pattern="[A-Za-z0-9_]{2,20}" class="input-field uppercase font-mono">
                    <p class="field-hint">Tidak bisa diubah setelah disimpan</p></div>
                <div><label class="field-label" for="orgKatPrefix">Prefix Kode Personel</label>
                    <input type="text" id="orgKatPrefix" name="prefix_kode" maxlength="10" pattern="[A-Za-z0-9]{1,10}" class="input-field uppercase font-mono">
                    <p class="field-hint">mis. DRV → DRV-001, DRV-002</p></div>
            </div>
            <div><label class="field-label" for="orgKatNama">Nama</label>
                <input type="text" id="orgKatNama" name="nama" required maxlength="50" class="input-field"></div>
            <div class="flex gap-6 text-sm">
                <label class="flex items-center gap-2"><input type="checkbox" name="wajib_sim" value="1"> Wajib SIM</label>
                <label class="flex items-center gap-2"><input type="checkbox" name="boleh_akun" value="1"> Boleh punya akun login</label>
            </div>
        </div>
        <div class="px-6 pb-6 flex justify-end gap-2">
            <button type="button" data-on-click="closeModal" data-arg="modalOrg-kategori" class="btn-secondary">Batal</button>
            <button type="submit" class="btn-primary">Simpan</button>
        </div>
    </form>
</div>
