{% from "partials/layout/_macros.html" import section_header %}
<div class="filter-bar">
    <div class="seg flex-wrap">
        <button type="button" class="chip chip-active" data-filter="" data-on-click="filterRoleUser" data-arg="$el">Semua</button>
        {% for lv in level_list %}
        <button type="button" class="chip" data-filter="{{ lv.kode }}" data-on-click="filterRoleUser" data-arg="$el">{{ lv.nama }}</button>
        {% endfor %}
    </div>
    <div class="flex-1"></div>
    <div class="relative">
        <input type="text" id="cariUser" placeholder="Cari username / nama / NIK" class="input-field pl-9 w-60" data-on-input="cariUser" data-arg="$value">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
    </div>
    <button type="button" class="btn-primary" data-on-click="bukaTambahUser"><i class="fa-solid fa-user-plus mr-1"></i> Tambah Pengguna</button>
</div>

<div class="section-box">
    {{ section_header('daftar-user', 'Daftar Pengguna') }}
    <div id="body-daftar-user" class="section-body overflow-x-auto">
        <table class="w-full text-left text-sm">
            <thead class="table-header-row">
                <tr>
                    <th class="table-cell">Username</th><th class="table-cell">Nama</th><th class="table-cell">Jabatan</th>
                    <th class="table-cell">Departemen</th><th class="table-cell">Area</th>
                    <th class="table-cell">Status</th><th class="table-cell">Login Terakhir</th><th class="table-cell">Dibuat</th>
                    <th class="table-cell text-right">Aksi</th>
                </tr>
            </thead>
            <tbody data-per-halaman="20" id="tabelUser" class="divide-y divide-slate-100"></tbody>
        </table>
    </div>
</div>
