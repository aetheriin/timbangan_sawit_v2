{% from "partials/layout/_macros.html" import section_header %}
<div class="filter-bar">
    <p id="infoSesiOtomatis" class="text-xs text-slate-500"></p>
    <div class="flex-1"></div>
    <button type="button" class="btn-secondary" data-on-click="muatUlang" data-arg="$el|muatSesi"><i class="fa-solid fa-rotate mr-1"></i> Muat Ulang</button>
</div>

<div class="card p-0 overflow-hidden mb-5">
    <div class="px-5 py-3.5 border-b border-slate-100"><h2 class="text-sm font-bold text-slate-900">Sedang Login</h2></div>
    <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
            <thead class="table-header-row">
                <tr><th class="table-cell">Pengguna</th><th class="table-cell">Perangkat</th><th class="table-cell">IP</th>
                    <th class="table-cell">Login Sejak</th><th class="table-cell">Tidak Aktif</th><th class="table-cell text-right">Aksi</th></tr>
            </thead>
            <tbody data-per-halaman="20" id="tabelSesi" data-sorot class="divide-y divide-slate-100"></tbody>
        </table>
    </div>
</div>

<div class="section-box">
    {% call section_header('login-terkunci', 'Login Terkunci') %}
    <button type="button" class="btn-outline-danger py-1.5 whitespace-nowrap" data-henti-klik data-on-click="bukaSemuaKunci">Buka Semua</button>
    {% endcall %}
    <div id="body-login-terkunci" class="section-body overflow-x-auto">
        <form id="formBukaKunci" class="flex items-center gap-2 px-5 py-3 border-b border-slate-100" autocomplete="off">
            <input type="text" name="teks" required maxlength="60" placeholder="Username / IP" class="input-field py-1.5 max-w-sm">
            <button type="submit" class="btn-primary py-1.5 whitespace-nowrap"><i class="fa-solid fa-lock-open mr-1"></i> Buka Kunci</button>
        </form>
        <table class="w-full text-left text-sm">
            <thead class="table-header-row">
                <tr>
                    <th class="table-cell">Jenis</th><th class="table-cell">Username / IP</th><th class="table-cell">Username yang Dicoba</th><th class="table-cell">Terbuka Lagi Dalam</th>
                    <th class="table-cell text-right">Aksi</th>
                </tr>
            </thead>
            <tbody data-per-halaman="20" id="tabelTerkunci" class="divide-y divide-slate-100"></tbody>
        </table>
    </div>
</div>
