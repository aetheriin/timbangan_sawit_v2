<!-- MODAL: Alur persetujuan (jenis + kategori + urutan tahap) -->
<div id="modalAlurSetuju" class="modal-overlay">
    <form id="formAlurSetuju" class="modal-box max-w-2xl" autocomplete="off">
        <div class="modal-header">
            <h3 class="font-bold" id="judulAlurSetuju">Alur Persetujuan</h3>
            <button type="button" data-on-click="closeModal" data-arg="modalAlurSetuju" title="Tutup"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-6 space-y-4">
            <input type="hidden" name="id_alur_persetujuan">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div><label class="field-label" for="alurJenis">Jenis Pengajuan</label>
                    <select id="alurJenis" name="jenis" required class="input-field"></select></div>
                <div><label class="field-label" for="alurKategori">Kategori Target</label>
                    <select id="alurKategori" name="kategori" class="input-field"></select>
                    <p class="field-hint">Mis. Driver, Security, Karyawan, BHL. "Semua kategori" = cadangan.</p></div>
                <div class="sm:col-span-2"><label class="field-label" for="alurKet">Keterangan</label>
                    <input type="text" id="alurKet" name="keterangan" maxlength="255" class="input-field" placeholder="Opsional"></div>
            </div>
            <div>
                <div class="flex items-center justify-between mb-2">
                    <p class="field-label mb-0">Tahap (berurutan)</p>
                    <button type="button" class="link-aksi text-blue-600" data-on-click="tambahTahapAlur"><i class="fa-solid fa-plus mr-1"></i>Tambah tahap</button>
                </div>
                <div id="daftarTahapAlur" class="space-y-2"></div>
                <p id="pratinjauAlur" class="mt-3 text-xs text-slate-500"></p>
            </div>
        </div>
        <div class="px-6 pb-6 flex justify-end gap-2">
            <button type="button" data-on-click="closeModal" data-arg="modalAlurSetuju" class="btn-secondary">Batal</button>
            <button type="submit" class="btn-primary">Simpan</button>
        </div>
    </form>
</div>
