<!DOCTYPE html>
<html lang="id" style="font-size: 100%">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Weighbridge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fonts/inter.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
</head>
<body class="font-sans bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-md p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="bg-emerald-500 text-slate-900 w-14 h-14 rounded-2xl shadow-lg flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-truck-ramp-box text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Smart Weighbridge</h2>
            <p class="text-xs text-slate-400">PT Yuni Bersaudara Sejahtera</p>
        </div>

        {% if info %}
        <div class="bg-amber-500/10 border border-amber-500/30 text-amber-200 text-sm px-4 py-2.5 rounded-xl">{{ info }}</div>
        {% endif %}
        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 text-red-300 text-sm px-4 py-2.5 rounded-xl">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" class="space-y-4" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Username</label>
                <input type="text" name="username" required autofocus class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Password</label>
                <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl text-sm shadow-lg transition">
                Masuk
            </button>
        </form>
    </div>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
